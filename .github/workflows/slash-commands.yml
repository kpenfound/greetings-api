name: PR Slash Commands
on:
  issue_comment:
    types: [created]
env:
  DAGGER_RELEASE: v1.0.0-beta.11
jobs:
  comment-created:
    runs-on: ubuntu-latest
    steps:
      - name: Generate an agent token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KAL_APP_ID }}
          private-key: ${{ secrets.KAL_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      # DAGGER_VERSION pins the CLI to the release this repo targets; the
      # installer prepends the "v" itself, so it is stripped here. --x-release on
      # each call pins the engine to the same version.
      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_RELEASE#v}" BIN_DIR=$RUNNER_TEMP/bin sh
          echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH
          "$RUNNER_TEMP/bin/dagger" version
      - name: slash agent
        if: github.event.issue.pull_request && contains(github.event.comment.body, '/agent')
        run: dagger --x-release=$DAGGER_RELEASE api call pull-request-feedback --github-token GH_TOKEN --issue-id ${{ github.event.issue.number }} --feedback "${{ github.event.comment.body }}"
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: slash review
        if: github.event.issue.pull_request && contains(github.event.comment.body, '/review')
        run: dagger --x-release=$DAGGER_RELEASE api call pull-request-review --github-token GH_TOKEN --issue-id ${{ github.event.issue.number }}
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: slash develop
        if: ${{ !github.event.issue.pull_request && contains(github.event.comment.body, '/develop') }}
        run: dagger --x-release=$DAGGER_RELEASE api call develop-pull-request --github-token GH_TOKEN --issue-id ${{ github.event.issue.number }}
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
