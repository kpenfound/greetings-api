[modules.greetings]
source = ".dagger/modules/greetings"
entrypoint = true

[modules.greetings.settings]
backendBinary = "dag://go-build/modules/binaries/build?go-module=.&go-binary=."

[modules.backend]
source = ".dagger/modules/backend"

[modules.backend.settings]
binary = "dag://go-build/modules/binaries/build?go-module=.&go-binary=."

[modules.frontend]
source = ".dagger/modules/frontend"

[modules.dagger-go-sdk]
source = "github.com/dagger/go-sdk"

[modules.dagger-typescript-sdk]
source = "github.com/dagger/typescript-sdk"

[modules.go]
source = "github.com/dagger/go@collections"

[modules.go.settings]
# The e2e tests in e2e_test.go need the API running. The toolchain cannot start
# it, so it is handed a base container with backend:serve already bound (as
# GREETINGS_API_URL) and it runs the tests itself. Without this its test check
# would run without the variable, and the e2e tests skip when that is unset,
# which looks exactly like passing.
base = "dag://backend/go-test-base"
# Binaries come from go-build instead: building here would run on the base
# above, which needs the backend binary, a cycle.
build = ["!**"]

[modules.go-build]
source = "github.com/dagger/go@collections"

[modules.go-build.settings]
# Builds the binaries backend and greetings are wired to, on the default Go
# container. Tests and generate stay with go.
#
# Go 1.26 rather than the 1.18 in go.mod: 1.18 builds with cgo on, linking
# against Alpine's musl, and the binary then fails to start on glibc-based
# wolfi. From 1.20 cgo is off without a C compiler, so the binary is static.
version = "1.26"
test = ["!**"]
generate = ["!**"]

[modules.golangci-lint]
source = "dagger.io/go/golangci-lint@collections"

[modules.eslint]
source = "dagger.io/js/eslint@collections"

[modules.playwright]
source = "github.com/dagger/playwright@collections"

[modules.playwright.settings]
service = "dag://frontend/serve"

[sdks.go]
module = "dagger-go-sdk"

[sdks.go.scopes.".dagger/modules/backend"]
is-module = true

[sdks.go.scopes.".dagger/modules/greetings"]
is-module = true
clients = ["./.dagger/modules/frontend"]

[sdks.typescript]
module = "dagger-typescript-sdk"

[sdks.typescript.scopes.".dagger/modules/frontend"]
is-module = true
