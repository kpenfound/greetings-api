[modules.greetings]
source = ".dagger/modules/greetings"
entrypoint = true

[modules.backend]
source = ".dagger/backend"

[modules.frontend]
source = ".dagger/frontend"

[modules.dagger-go-sdk]
source = "github.com/dagger/go-sdk"

[modules.dagger-typescript-sdk]
source = "github.com/dagger/typescript-sdk"

[modules.go]
source = "github.com/dagger/go"

[modules.go.settings]
# The e2e tests in e2e_test.go need the API running. The toolchain cannot start
# it, so it is handed a base container with backend:serve already bound (as
# GREETINGS_API_URL) and it runs the tests itself. Without this its test check
# would run without the variable, and the e2e tests skip when that is unset,
# which looks exactly like passing.
base = "backend:go-test-base"

[modules.eslint]
source = "github.com/dagger/eslint"

[modules.playwright]
source = "github.com/dagger/playwright"

[modules.playwright.settings]
service = "frontend:serve"

[sdks.go]
module = "dagger-go-sdk"

[sdks.go.scopes.".dagger/backend"]
is-module = true
clients = ["github.com/dagger/go@548de867d65d3074c5730c70f317094f167709c7"]

[sdks.go.scopes.".dagger/modules/greetings"]
is-module = true
clients = ["./.dagger/backend", "./.dagger/frontend", "github.com/kpenfound/dag/github-issue@2b76331a92be6da3fead95305e7bf2a70726c1e6", "github.com/kpenfound/jpadams-github-release@c6081b3210407d5ea49fce8874c5104afa8373cb", "./.dagger/workspace"]

[sdks.go.scopes.".dagger/workspace"]
is-module = true
name = "code-workspace"

[sdks.typescript]
module = "dagger-typescript-sdk"

[sdks.typescript.scopes.".dagger/frontend"]
is-module = true
